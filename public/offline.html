<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#1c1411">
    <title>Pas de connexion — Chez Traoré</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <style>
        * { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; }
        body {
            display: flex; align-items: center; justify-content: center; padding: 24px;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            color: #f2e9e1; text-align: center;
            background: radial-gradient(ellipse at 30% 0%, #7a3510 0%, #2e211c 45%, #1c1411 100%);
        }
        .card { max-width: 420px; }
        .logo {
            width: 88px; height: 88px; margin: 0 auto 28px; border-radius: 22px;
            display: flex; align-items: center; justify-content: center;
            background: linear-gradient(135deg, #fb9534, #b95208);
            box-shadow: 0 18px 40px -12px rgba(245, 118, 14, .6);
            animation: breathe 2.6s ease-in-out infinite;
        }
        .logo svg { width: 52px; height: 52px; }
        h1 { margin: 0 0 10px; font-size: 26px; color: #fff; }
        p { margin: 0 0 8px; line-height: 1.55; color: #cdb39c; }
        .hint { font-size: 14px; color: #b08c6e; }
        button {
            margin-top: 26px; padding: 14px 28px; border: 0; border-radius: 14px; cursor: pointer;
            font: inherit; font-weight: 700; color: #fff; background: #f5760e;
            box-shadow: 0 10px 24px -10px rgba(245, 118, 14, .8);
            transition: transform .15s ease, background-color .15s ease;
        }
        button:hover { background: #fb9534; transform: translateY(-1px); }
        button:active { transform: scale(.98); }
        @keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
        @media (prefers-reduced-motion: reduce) { .logo { animation: none; } }
    </style>
</head>
<body>
    <main class="card">
        <div class="logo" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                <path d="M15.362 5.214A8.252 8.252 0 0 1 12 21 8.25 8.25 0 0 1 6.038 7.047 8.287 8.287 0 0 0 9 9.601a8.983 8.983 0 0 1 3.361-6.867 8.21 8.21 0 0 0 3 2.48Z"/>
                <path d="M12 18a3.75 3.75 0 0 0 .495-7.468 5.99 5.99 0 0 0-1.925 3.547 5.975 5.975 0 0 1-2.133-1.001A3.75 3.75 0 0 0 12 18Z"/>
            </svg>
        </div>
        <h1>Pas de connexion</h1>
        <p>Chez Traoré a besoin d'Internet pour afficher le menu, enregistrer les ventes et les commandes.</p>
        <p class="hint">Vérifiez le Wi-Fi ou les données mobiles, puis réessayez.</p>
        <button type="button" onclick="location.reload()">Réessayer</button>
    </main>
    <script>
        // Recharge tout seul dès que la connexion revient.
        window.addEventListener('online', () => location.reload());
    </script>
</body>
</html>
